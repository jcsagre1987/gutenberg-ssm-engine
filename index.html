<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gutenberg SSM Engine</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --sidebar-bg: #111827;
            --chat-bg: #0d1322;
            --card-bg: #1f2937;
            --user-bubble: #1d4ed8;
            --assistant-bubble: #1e293b;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #2563eb;
            --accent-hover: #1d4ed8;
            --success-green: #10b981;
            --error-red: #ef4444;
            --border-color: #374151;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background-color: var(--sidebar-bg); border-right: 1px solid var(--border-color); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        .sidebar h2 { font-size: 1.1rem; font-weight: 600; margin-bottom: 10px; }
        .param-group { display: flex; flex-direction: column; gap: 8px; }
        .param-group label { font-size: 0.85rem; color: var(--text-muted); display: flex; justify-content: space-between; }
        .param-group select, .param-group input[type="number"] { background-color: #1a2234; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; }
        .param-group input[type="range"] { width: 100%; accent-color: var(--accent-blue); }
        .main-container { flex: 1; display: flex; flex-direction: column; background-color: var(--chat-bg); }
        .header { padding: 16px 24px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 1.25rem; font-weight: 700; }
        .status-badge { font-size: 0.8rem; display: flex; align-items: center; gap: 6px; color: var(--text-muted); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background-color: #ef4444; }
        .status-dot.connected { background-color: var(--success-green); }
        .chat-box { flex: 1; padding: 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
        .message-wrapper { display: flex; flex-direction: column; max-width: 75%; }
        .message-wrapper.user { align-self: flex-end; align-items: flex-end; }
        .message-wrapper.assistant { align-self: flex-start; align-items: flex-start; }
        .bubble { padding: 12px 16px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; word-break: break-word; }
        .user .bubble { background-color: var(--user-bubble); color: #ffffff; border-bottom-right-radius: 2px; }
        .assistant .bubble { background-color: var(--assistant-bubble); color: var(--text-main); border: 1px solid var(--border-color); border-bottom-left-radius: 2px; }
        .action-bar { margin-top: 4px; display: flex; gap: 8px; align-items: center; }
        .kb-btn { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 0.85rem; padding: 4px 8px; border-radius: 4px; transition: background 0.2s, color 0.2s; display: flex; align-items: center; gap: 4px; }
        .kb-btn:hover { background-color: var(--card-bg); color: var(--text-main); }
        .kb-btn.saved { color: var(--success-green); cursor: default; }
        .kb-btn.flagged { color: var(--error-red); cursor: default; }
        .input-container { padding: 16px 24px; border-top: 1px solid var(--border-color); display: flex; gap: 12px; background-color: var(--sidebar-bg); }
        .prompt-textarea { flex: 1; background-color: #1a2234; border: 1px solid var(--border-color); color: var(--text-main); padding: 12px 16px; border-radius: 8px; font-size: 0.95rem; resize: none; height: 48px; outline: none; }
        .send-btn { background-color: var(--accent-blue); color: #ffffff; border: none; padding: 0 24px; border-radius: 8px; font-weight: 600; cursor: pointer; }
        .send-btn:hover { background-color: var(--accent-hover); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>SSM Parameters</h2>
        <div class="param-group">
            <label for="temperature"><span>Temperature</span><span id="temp-val">(0.7)</span></label>
            <input type="range" id="temperature" min="0.0" max="1.0" step="0.05" value="0.7">
        </div>
        <div class="param-group">
            <label for="max-tokens">Max Tokens</label>
            <input type="number" id="max-tokens" value="250" min="10" max="1024">
        </div>
    </div>
    <div class="main-container">
        <div class="header">
            <h1>Gutenberg SSM Engine</h1>
            <div class="status-badge"><div class="status-dot" id="status-dot"></div><span id="status-text">Disconnected</span></div>
        </div>
        <div class="chat-box" id="chat-box">
            <div class="message-wrapper assistant"><div class="bubble">Hello! I am Gutenberg SSM, your fluid local engine. How can I help you today, Boss?</div></div>
        </div>
        <div class="input-container">
            <textarea id="prompt-input" class="prompt-textarea" placeholder="Type your prompt here... (Press Enter to send)"></textarea>
            <button id="send-btn" class="send-btn">Send</button>
        </div>
    </div>
    <script>
        const SERVER_URL = "http://127.0.0.1:18080";
        const chatBox = document.getElementById("chat-box");
        const promptInput = document.getElementById("prompt-input");
        const sendBtn = document.getElementById("send-btn");
        let messageHistory = [];

        async function checkServerConnection() {
            try {
                const res = await fetch(`${SERVER_URL}/`);
                if (res.ok) {
                    document.getElementById("status-dot").classList.add("connected");
                    document.getElementById("status-text").textContent = "Connected";
                }
            } catch (e) {
                document.getElementById("status-dot").classList.remove("connected");
                document.getElementById("status-text").textContent = "Disconnected";
            }
        }
        checkServerConnection();
        setInterval(checkServerConnection, 10000);

        function appendMessage(role, text) {
            const wrapper = document.createElement("div");
            wrapper.classList.add("message-wrapper", role);
            const bubble = document.createElement("div");
            bubble.classList.add("bubble");
            bubble.textContent = text;
            wrapper.appendChild(bubble);
            chatBox.appendChild(wrapper);
            chatBox.scrollTop = chatBox.scrollHeight;
            return { wrapper, bubble };
        }

        function addActionButtons(wrapper, userPrompt, assistantResponse, isSaveable) {
            if (isSaveable === false) return;

            const actionBar = document.createElement("div");
            actionBar.classList.add("action-bar");

            // Thumbs Up Button (Save to KB)
            const thumbsUpBtn = document.createElement("button");
            thumbsUpBtn.classList.add("kb-btn");
            thumbsUpBtn.innerHTML = `👍 Save to KB`;
            thumbsUpBtn.addEventListener("click", async () => {
                const res = await fetch(`${SERVER_URL}/api/kb/save`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: userPrompt, response: assistantResponse, category: "facts" })
                });
                if (res.ok) {
                    thumbsUpBtn.classList.add("saved");
                    thumbsUpBtn.innerHTML = `✓ Saved to KB`;
                    thumbsUpBtn.disabled = true;
                }
            });

            // X Button (Flag Error / Redundant)
            const flagBtn = document.createElement("button");
            flagBtn.classList.add("kb-btn");
            flagBtn.innerHTML = `❌ Flag Error`;
            flagBtn.addEventListener("click", async () => {
                const res = await fetch(`${SERVER_URL}/api/kb/flag`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ prompt: userPrompt, response: assistantResponse })
                });
                if (res.ok) {
                    flagBtn.classList.add("flagged");
                    flagBtn.innerHTML = `✓ Flagged & Logged`;
                    flagBtn.disabled = true;
                }
            });

            actionBar.appendChild(thumbsUpBtn);
            actionBar.appendChild(flagBtn);
            wrapper.appendChild(actionBar);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function handleSend() {
            const prompt = promptInput.value.trim();
            if (!prompt) return;
            promptInput.value = "";
            sendBtn.disabled = true;

            appendMessage("user", prompt);
            messageHistory.push({ role: "user", content: prompt });
            const { wrapper, bubble } = appendMessage("assistant", "");

            let fullResponse = "";
            let isSaveable = true;

            try {
                const response = await fetch(`${SERVER_URL}/v1/chat/completions`, {
                    method: "POST", headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ messages: messageHistory, max_tokens: 250, stream: true })
                });
                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    const chunk = decoder.decode(value, { stream: true });
                    for (const line of chunk.split("\n")) {
                        if (line.startsWith("data: ")) {
                            const dataStr = line.replace("data: ", "").trim();
                            if (dataStr === "[DONE]") break;
                            try {
                                const parsed = JSON.parse(dataStr);
                                if (parsed.saveable !== undefined) isSaveable = parsed.saveable;
                                const delta = parsed.choices[0]?.delta?.content || "";
                                fullResponse += delta;
                                bubble.textContent = fullResponse;
                                chatBox.scrollTop = chatBox.scrollHeight;
                            } catch (e) {}
                        }
                    }
                }
                messageHistory.push({ role: "assistant", content: fullResponse });
                if (fullResponse.trim()) addActionButtons(wrapper, prompt, fullResponse, isSaveable);
            } catch (err) {
                bubble.textContent = "Error connecting to engine.";
            } finally {
                sendBtn.disabled = false;
                promptInput.focus();
            }
        }

        sendBtn.addEventListener("click", handleSend);
        promptInput.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); } });
    </script>
</body>
</html>
